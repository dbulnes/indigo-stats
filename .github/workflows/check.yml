name: Build and test

on:
  push:
    branches: ['**']
    tags-ignore: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test (Unraid AMD64)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install backend dependencies
        run: pip install -r backend/requirements.lock
      - name: Test backend
        run: python -m unittest discover -s backend/tests -v
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check synchronized application version
        run: node scripts/bump-version.mjs --check
      - name: Build TypeScript frontend and PWA
        run: npm ci && npm run build
        working-directory: web
      - name: Build native container image
        run: docker build --platform linux/amd64 -t indigo-stats-ci:amd64 .
      - name: Test container startup and persistence
        run: sh deploy/smoke-test.sh indigo-stats-ci:amd64
