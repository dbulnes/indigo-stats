name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install backend dependencies
        run: pip install -r backend/requirements.lock
      - name: Test backend
        run: python -m unittest discover -s backend/tests -v
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build TypeScript frontend and PWA
        run: npm ci && npm run build
        working-directory: web
      - name: Build native container image
        run: docker build --platform linux/${{ matrix.arch }} -t indigo-stats-ci:${{ matrix.arch }} .
      - name: Test container startup and persistence
        run: sh deploy/smoke-test.sh indigo-stats-ci:${{ matrix.arch }}
