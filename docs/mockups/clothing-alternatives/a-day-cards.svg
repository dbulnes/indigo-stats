<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" font-size="14" role="img" aria-labelledby="title desc">
<title id="title">A — Day cards: recommended clothing panel concept</title>
<desc id="desc">Static Indigo Stats design with three side-by-side period cards, independent clothing group preferences and accessory usefulness estimates. All weather, recommendations and usage are synthetic.</desc>
<defs>
