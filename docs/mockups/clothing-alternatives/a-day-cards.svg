  <g id="sun" fill="none" stroke="#e4bd86" stroke-width="1.8" stroke-linecap="round"><circle cx="17" cy="16" r="7"/><path d="M17 2v3m0 22v3M3 16h3m22 0h3M7 6l2 2m16 16 2 2M7 26l2-2M25 8l2-2"/></g>
