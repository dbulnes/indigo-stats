services:
  indigo-stats:
    image: ghcr.io/dbulnes/indigo-stats:latest
    container_name: indigo-stats
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    ports:
      - "127.0.0.1:8765:8000"
    volumes:
      - "${INDIGO_DATA_DIR:?Set a persistent local appdata directory}:/data"
      # Optional host-mounted NFS/SMB/SSHFS/local filesystem for the filesystem provider.
      # It must already be mounted and writable by PUID:PGID; never point /data at it.
      # - "${INDIGO_OFFSITE_DIR}:/offsite"
    environment:
      DATA_DIR: /data
      PUID: "${PUID:-99}"
      PGID: "${PGID:-100}"
      SENSOR_HOST: "${SENSOR_HOST:?Set your sensor LAN IP}"
      TZ: "${TZ:-Etc/UTC}"
      PM_METHOD: "${PM_METHOD:-cf1}"
      ENVIRONMENT_MODE: "${ENVIRONMENT_MODE:-purpleair}"
      FORECAST_ENABLED: "${FORECAST_ENABLED:-false}"
      FORECAST_LATITUDE: "${FORECAST_LATITUDE:-}"
      FORECAST_LONGITUDE: "${FORECAST_LONGITUDE:-}"
      # Backup provider secrets are optional. Prefer Docker secrets and the matching _FILE variables.
      # BACKUP_S3_ACCESS_KEY_ID_FILE: /run/secrets/backup_s3_access_key_id
      # BACKUP_S3_SECRET_ACCESS_KEY_FILE: /run/secrets/backup_s3_secret_access_key
      # BACKUP_GOOGLE_CLIENT_ID_FILE: /run/secrets/backup_google_client_id
      # BACKUP_GOOGLE_CLIENT_SECRET_FILE: /run/secrets/backup_google_client_secret
      # BACKUP_GOOGLE_CALLBACK_URI: https://private.example/api/backups/google/callback
    stop_grace_period: 35s
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
